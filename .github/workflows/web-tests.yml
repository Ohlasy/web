name: Web test

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/web-tests.yml"
  pull_request:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/web-tests.yml"

defaults:
  run:
    working-directory: web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test
